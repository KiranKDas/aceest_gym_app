version: '3.8'

services:
  # ACEest Fitness Flask Application (v3.0.0)
  aceest-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kirankdas/aceest-fitness:3.0.0
    container_name: aceest-fitness-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - APP_VERSION=3.0.0
      - SECRET_KEY=aceest-compose-secret-key-2026
    volumes:
      - aceest-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # SonarQube Server for Local Static Code Analysis
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-server
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonarpassword
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
    depends_on:
      - sonar-db
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  # PostgreSQL Database for SonarQube
  sonar-db:
    image: postgres:15-alpine
    container_name: sonar-postgres-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonarpassword
      - POSTGRES_DB=sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  aceest-data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
