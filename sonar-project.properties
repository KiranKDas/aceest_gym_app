# Project Identification
sonar.projectKey=KiranKDas_aceest_gym_app
sonar.projectName=ACEest Fitness & Gym Management System
sonar.projectVersion=3.0.0

# Source & Test Code Paths
sonar.sources=app.py,ACEest_Fitness.py
sonar.tests=tests

# Encodings
sonar.sourceEncoding=UTF-8

# Test & Coverage Reports Integration
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Inclusions & Exclusions
sonar.exclusions=reports/**,venv/**,tests/**,versions/**
sonar.inclusions=app.py,ACEest_Fitness.py

# Quality Gate Thresholds
sonar.qualitygate.wait=true
