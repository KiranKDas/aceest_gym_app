apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-experiment-variant-a
  namespace: aceest-fitness
  labels:
    app: aceest-experiment
    variant: A
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-experiment
      variant: A
  template:
    metadata:
      labels:
        app: aceest-experiment
        variant: A
        version: "2.2.0"
    spec:
      containers:
      - name: aceest-fitness
        image: kirankdas/aceest-fitness:2.2.0
        ports:
        - containerPort: 5000
        env:
        - name: EXPERIMENT_VARIANT
          value: "A"
