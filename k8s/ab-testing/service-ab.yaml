apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a-service
  namespace: aceest-fitness
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: aceest-experiment
    variant: A
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b-service
  namespace: aceest-fitness
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: aceest-experiment
    variant: B
