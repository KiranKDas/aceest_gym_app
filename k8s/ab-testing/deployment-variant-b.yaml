apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-experiment-variant-b
  namespace: aceest-fitness
  labels:
    app: aceest-experiment
    variant: B
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-experiment
      variant: B
  template:
    metadata:
      labels:
        app: aceest-experiment
        variant: B
        version: "3.0.0"
    spec:
      containers:
      - name: aceest-fitness
        image: kirankdas/aceest-fitness:3.0.0
        ports:
        - containerPort: 5000
        env:
        - name: EXPERIMENT_VARIANT
          value: "B"
