apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-production-ingress
  namespace: aceest-fitness
spec:
  rules:
  - host: fitness.aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-production-service
            port:
              number: 80
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-production-service
            port:
              number: 80
