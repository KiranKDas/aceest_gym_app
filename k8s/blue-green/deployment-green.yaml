apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-green
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    environment: production
    color: green
    version: "3.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      color: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        color: green
        version: "3.0.0"
    spec:
      containers:
      - name: aceest-fitness
        image: kirankdas/aceest-fitness:3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "3.0.0"
        - name: DEPLOY_COLOR
          value: "green"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
