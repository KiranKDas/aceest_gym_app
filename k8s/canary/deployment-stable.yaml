apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest-fitness
  labels:
    app: aceest-canary-workload
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: aceest-canary-workload
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary-workload
        track: stable
        version: "2.2.0"
    spec:
      containers:
      - name: aceest-fitness
        image: kirankdas/aceest-fitness:2.2.0
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
