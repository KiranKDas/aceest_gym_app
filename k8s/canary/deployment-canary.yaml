apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-v3
  namespace: aceest-fitness
  labels:
    app: aceest-canary-workload
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary-workload
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary-workload
        track: canary
        version: "3.0.0"
    spec:
      containers:
      - name: aceest-fitness
        image: kirankdas/aceest-fitness:3.0.0
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
