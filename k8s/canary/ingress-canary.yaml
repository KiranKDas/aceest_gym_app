apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-ingress
  namespace: aceest-fitness
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  rules:
  - host: fitness.aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-canary-v3-service
            port:
              number: 80
