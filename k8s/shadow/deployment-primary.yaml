apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-primary
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    role: primary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      role: primary
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: primary
        version: "2.2.0"
    spec:
      containers:
      - name: aceest-fitness
        image: kirankdas/aceest-fitness:2.2.0
        ports:
        - containerPort: 5000
