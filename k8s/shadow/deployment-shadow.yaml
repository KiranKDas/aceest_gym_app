apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-dark
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    role: shadow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: shadow
        version: "3.0.0"
    spec:
      containers:
      - name: aceest-fitness
        image: kirankdas/aceest-fitness:3.0.0
        ports:
        - containerPort: 5000
