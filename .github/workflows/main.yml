name: ACEest CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    name: "Stage 1: Build & Lint Code"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Syntax & Lint Quality Gate (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=test_env,.git
          # Exit-zero treats all errors as warnings. Max line length set to 120
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --exclude=test_env,.git

  docker-build:
    name: "Stage 2: Docker Image Assembly"
    needs: lint-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aceest-fitness-gym:latest
          outputs: type=docker,dest=/tmp/aceest-fitness-gym.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/aceest-fitness-gym.tar
          retention-days: 1

  containerized-tests:
    name: "Stage 3: Pytest Suite Inside Container"
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker Image
        run: |
          docker load --input /tmp/aceest-fitness-gym.tar
          docker images

      - name: Execute Pytest Suite Inside Container
        run: |
          docker run --rm aceest-fitness-gym:latest pytest -v --tb=short
